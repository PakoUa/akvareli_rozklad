name: Weekly light chart

on:
  schedule:
  - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-chart
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Кеш браузера Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('scripts/requirements.txt') }}

      - run: playwright install --with-deps chromium

      - name: Створити або оновити повідомлення в каналі
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: python scripts/update_week_chart.py

      - name: Зберегти стан
  run: |
    git config user.name "github-actions[bot]"
    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
    git add state/week_chart.json
    git diff --cached --quiet || (
      git commit -m "Стан діаграми тижня" &&
      git pull --rebase origin main &&
      git push
    )
